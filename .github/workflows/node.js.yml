name: Node.js CI

permissions:
  contents: read

on:
  push:
    branches: [ "main", "branch_mode", "better", "bin"]
  pull_request:
    branches: [ "main", "branch_mode", "better", "bin"]
jobs:
  test:
    # Der Runner nutzt nun die Betriebssysteme aus der Matrix
    runs-on: ${{ matrix.os }}
    
    strategy:
      # Verhindert, dass alle anderen Jobs abgebrochen werden, falls einer fehlschlägt
      fail-fast: false 
      matrix:
        # Hier definieren wir die Betriebssysteme (Linux, Windows, macOS)
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
        
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build (if present)
        run: npm run build --if-present
